[project]
name = "trajectree"
version = "0.1.0"
description = "Self-hosted project tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apsw>=3.54.1.0",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "python-ulid>=4",
    "httpx",
    "mcp>=2.3.0",
]

[project.scripts]
trajectreed = "trajectree.main:run"
trajectree = "trajectree.cli.main:entry"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectree"]
artifacts = ["src/trajectree/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
