services:
  trajectree:
    build: .
    ports: ["127.0.0.1:8742:8742"]
    volumes: ["./data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
