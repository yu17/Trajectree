name: trajectree-dev

services:
  trajectree:
    build:
      context: .
      target: ${TRAJECTREE_IMAGE_TARGET:-app}
    ports: ["127.0.0.1:8743:8742"]
    volumes:
      - ${TRAJECTREE_DEV_STATE:-${HOME}/.local/share/trajectree-dev}/data:/data
      - ${TRAJECTREE_DEV_STATE:-${HOME}/.local/share/trajectree-dev}/cfg:/cfg
      - ${HOME}/.claude/projects:/host/claude/projects:ro
      - ${HOME}/.config/claude-backends:/host/claude-backends:ro
      - ${HOME}/.codex/sessions:/host/codex/sessions:ro
      - ${TRAJECTREE_PROJECTS_ROOT:?set TRAJECTREE_PROJECTS_ROOT to the folder that holds your project folders}:/projects:ro
    environment:
      TRAJECTREE_CLAUDE_HOME: /host/claude
      TRAJECTREE_BACKENDS_ROOT: /host/claude-backends
      TRAJECTREE_CODEX_SESSIONS: /host/codex/sessions
      TRAJECTREE_PATH_MAP: ${TRAJECTREE_PROJECTS_ROOT}=/projects
      TRAJECTREE_CFG_DIR: /cfg
      TRAJECTREE_PUBLIC_URL: http://127.0.0.1:8743
      HOME: /cfg/home
      DISABLE_AUTOUPDATER: "1"
      TRAJECTREE_TZ: ${TZ:-UTC}
      TRAJECTREE_GITLAB_HOST: ${TRAJECTREE_GITLAB_HOST:-}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
